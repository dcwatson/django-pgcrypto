name: CI

on: [push, pull_request]

env:
  UV_SYSTEM_PYTHON: 1
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON_PREFERENCE: only-system

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: secret
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
        ports:
          - 5432:5432
    strategy:
      fail-fast: true
      matrix:
        django-version: ["5.2", "6.0", "6.1"]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        include:
          - django-version: "5.2"
            python-version: "3.10"
          - django-version: "5.2"
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Run Tests
        run: uv run --with "django~=${{ matrix.django-version }}" manage.py test --noinput
        env:
          PGCRYPTO_TEST_DATABASE: django-pgcrypto-${{ matrix.django-version }}-${{ matrix.python-version }}
          PGCRYPTO_TEST_PASSWORD: secret
